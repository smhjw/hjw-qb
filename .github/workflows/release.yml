name: Release (unsigned artifacts)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build unsigned release artifacts
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          QBR_ALLOW_UNSIGNED_RELEASE: "1"

      - name: Stage versioned artifacts + checksums
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp app/build/outputs/apk/release/app-release-unsigned.apk "staging/qbitremote-v${VER}-unsigned.apk" 2>/dev/null \
            || cp app/build/outputs/apk/release/app-release.apk "staging/qbitremote-v${VER}-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "staging/qbitremote-v${VER}-unsigned.aab"
          cp app/build/outputs/mapping/release/mapping.txt "staging/mapping-v${VER}.txt"
          (cd staging && sha256sum * > "SHA256SUMS-v${VER}-unsigned.txt" && cat "SHA256SUMS-v${VER}-unsigned.txt")

      - name: Upload release staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-${{ github.ref_name }}
          path: staging/
          if-no-files-found: error
          retention-days: 90

      # Signed binaries are still produced only on the owner's machine via
      # scripts/build-release-aab.ps1; the draft release carries the checksum
      # manifest and the owner attaches the signed APK/AAB from dist\ manually.
      - name: Create draft GitHub Release with checksums
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes \
            staging/SHA256SUMS-v${GITHUB_REF_NAME#v}-unsigned.txt || \
          gh release upload "${GITHUB_REF_NAME}" staging/SHA256SUMS-v${GITHUB_REF_NAME#v}-unsigned.txt --clobber
