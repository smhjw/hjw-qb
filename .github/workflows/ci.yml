name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned release build so CI validates the R8/proguard configuration.
      # Signed packaging for Google Play stays on the owner's machine
      # (scripts/build-release-aab.ps1) with the fixed upload key.
      - name: Build release APK + AAB (unsigned, R8)
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          QBR_ALLOW_UNSIGNED_RELEASE: "1"

      - name: Upload R8 mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-unsigned
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
